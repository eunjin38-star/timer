<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>교실 타이머</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,sans-serif;background:#fafaf7;color:#111}body{overflow:hidden}main{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:24px}.set{display:flex;justify-content:center;align-items:end;gap:12px}label{text-align:center;color:#777;font-weight:700}input{display:block;width:100px;height:52px;margin-top:5px;border:1px solid #ccc;border-radius:13px;background:#fff;font-size:26px;font-weight:700;text-align:center}.colon{font-size:30px;padding-bottom:8px;color:#777}.stage{display:flex;min-height:0;flex-direction:column;align-items:center;justify-content:center}#t{font-size:min(31vw,42vh);line-height:.82;font-weight:850;letter-spacing:-.07em;font-variant-numeric:tabular-nums;white-space:nowrap}#msg{margin-top:28px;font-size:24px;font-weight:650;color:#777}.buttons{display:flex;justify-content:center;gap:12px}button{height:56px;min-width:140px;border:0;border-radius:14px;font-size:18px;font-weight:750}#go{background:#111;color:#fff}#pause,#reset{background:#e8e8e3}.warn #t,.warn #msg{color:#d62f2f}@media(orientation:portrait){#t{font-size:min(30vw,25vh)}}</style></head><body><main id="app"><div class="set"><label>분<input id="m" type="number" inputmode="numeric" value="5" min="0"></label><div class="colon">:</div><label>초<input id="s" type="number" inputmode="numeric" value="0" min="0" max="59"></label></div><div class="stage"><div id="t">05:00</div><div id="msg">시간을 설정하고 시작을 누르세요.</div></div><div class="buttons"><button id="go">시작</button><button id="pause">일시정지</button><button id="reset">초기화</button></div></main><script>
(()=>{const A=document.querySelector('#app'),M=document.querySelector('#m'),S=document.querySelector('#s'),T=document.querySelector('#t'),G=document.querySelector('#msg');let r=300,id=0,end=0,ctx=null,w=new Set(),run=false;const read=()=>{let m=Math.max(0,parseInt(M.value)||0),s=Math.max(0,Math.min(59,parseInt(S.value)||0));M.value=m;S.value=s;return m*60+s},draw=()=>T.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0'),audio=()=>{let C=window.AudioContext||window.webkitAudioContext;if(!ctx&&C)ctx=new C();if(ctx&&ctx.state==='suspended')ctx.resume()},tone=(f,d=.16,v=.95)=>{if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.stop(ctx.currentTime+d)},stop=()=>{clearInterval(id);id=0;run=false},finish=()=>{stop();r=0;draw();A.classList.add('warn');G.textContent='시간 종료!';tone(950,.25,1);setTimeout(()=>tone(1200,.25,1),320);setTimeout(()=>tone(1450,.5,1),640)},tick=()=>{let x=end-Date.now(),n=Math.max(0,Math.ceil(x/1000));if(n!==r){r=n;draw();if(r>0&&r<=5&&!w.has(r)){w.add(r);A.classList.add('warn');G.textContent='종료 '+r+'초 전';tone(1250,.18,1);setTimeout(()=>tone(1250,.12,.8),200)}}if(x<=0)finish()},sync=()=>{if(run)return;r=read();A.classList.remove('warn');G.textContent='시간을 설정하고 시작을 누르세요.';draw()};M.oninput=S.oninput=sync;document.querySelector('#go').onclick=()=>{audio();if(run)return;if(r<=0)r=read();if(r<=0){G.textContent='1초 이상의 시간을 설정해주세요.';return}w.clear();A.classList.remove('warn');run=true;end=Date.now()+r*1000;G.textContent='진행 중';id=setInterval(tick,100)};document.querySelector('#pause').onclick=()=>{if(run){tick();stop();G.textContent='일시정지'}};document.querySelector('#reset').onclick=()=>{stop();w.clear();r=read();A.classList.remove('warn');G.textContent='시간을 설정하고 시작을 누르세요.';draw()};draw()})();
</script></body></html>
